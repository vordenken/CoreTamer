name: 🐛 Bug Report
description: Report a problem with CoreTamer
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please remove personal data such as usernames or private paths.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open CoreTamer
        2. Select process ...
        3. Set limit to ...
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: e.g. macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac Architecture
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: CoreTamer Version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, logs or anything else that helps.
