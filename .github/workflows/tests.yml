name: Tests

on:
  pull_request:
  push:
    branches: [main, 'feature/*']
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - 'CoreTamer/**'
      - 'CoreTamer.xcodeproj/**'
      - 'CoreTamerController/**'
      - 'CoreTamerCore/**'
      - 'CoreTamerTests/**'
      - 'ProcessControl/**'
      - 'appcast.xml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        run: |
          # Download the pinned release from the actionlint repository instead of using a third-party action.
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            --output "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  swift:
    name: Lint and unit tests
    # CoreTamer requires Xcode 26 or later; macos-26 ships it as the default Xcode.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: xcodebuild -version
      # Timing-based CPU workload tests and the coverage gate run locally via scripts/test.sh.
      - name: Run lint, static analysis and unit tests
        run: bash scripts/test.sh --unit-only
